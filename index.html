const StoryViewer = ({start,startI,onClose,onWatch}) => {
 const [g,setG] = useState(start);
 const [i,setI] = useState(startI||0);
 const items = STORY_GROUPS[g];
 const [p,setP] = useState(0);
 const [mute,setMute] = useState(true);
 const vref = el => { if(!el) return; if(!el.dataset.init){el.dataset.init='1';el.defaultMuted=true;el.muted=mute;const pr=el.play();if(pr&&pr.catch)pr.catch(()=>{})} else {el.muted=mute} };
 const v = items[i]; const k = skOf(v.sk);
 const next = () => { if(i<items.length-1){setI(i+1);setP(0)} else if(g<STORY_GROUPS.length-1){setG(g+1);setI(0);setP(0)} else onClose() };
 const prev = () => { if(i>0){setI(i-1);setP(0)} else if(g>0){setG(g-1);setI(STORY_GROUPS[g-1].length-1);setP(0)} else setP(0) };
 useEffect(()=>{if(v.clip) return;const t=setInterval(()=>setP(x=>x+2),100);return ()=>clearInterval(t)},[g,i]);
 useEffect(()=>{ if(p>=100&&!v.clip) next() },[p]);
 const tx = React.useRef({x:0,y:0});
 const pre = React.useRef([]);
 const at = d => { let gg=g,ii=i+d; while(gg<STORY_GROUPS.length){const L=STORY_GROUPS[gg].length; if(ii<L) return STORY_GROUPS[gg][ii]; ii-=L; gg++} return null };
 useEffect(()=>{
  pre.current = [];
  [1,2].forEach(d=>{const n=at(d); if(n&&n.poster){const im=new Image(); im.src=n.poster; pre.current.push(im)}});
  const nx=at(1); if(nx&&nx.clip){const vv=document.createElement('video'); vv.preload='auto'; vv.muted=true; vv.src=nx.clip; try{vv.load()}catch(e){} pre.current.push(vv)}
 },[g,i]);
 useEffect(()=>{const o=document.body.style.overflow;document.body.style.overflow='hidden';return ()=>{document.body.style.overflow=o}},[]);
 useEffect(()=>{
  const h = e => { if(e.key==='ArrowRight') next(); else if(e.key==='ArrowLeft') prev(); else if(e.key==='Escape') onClose() };
  window.addEventListener('keydown',h);
  return ()=>window.removeEventListener('keydown',h);
 },[g,i]);
 return html`<div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center ov" onClick=${onClose}>

   ${!v.clip && html`<div className="absolute inset-0 opacity-25" style=${{background:`repeating-linear-gradient(-30deg,hsl(${k.hue} 80% 55%) 0 16px,transparent 16px 46px)`}}></div>`}
   ${v.clip && html`<video key=${v.id} ref=${vref} src=${v.clip} poster=${v.poster} className=${'absolute inset-0 w-full h-full '+(v.fit==='contain'?'object-contain':'object-cover')} autoPlay muted=${mute} playsInline onTimeUpdate=${e=>setP(e.target.currentTime/(e.target.duration||1)*100)} onEnded=${next}></video>`}
   ${v.clip && html`<div className="absolute inset-0 bg-gradient-to-t from-black/75 via-transparent to-black/40"></div>`}
   <div className="absolute inset-0 flex"><div className="w-1/3" onClick=${prev}></div><div className="w-2/3" onClick=${next}></div></div>
   <div className="relative z-10 p-3 pointer-events-none">
    <div className="flex gap-1">${items.map((_,j)=>html`<div key=${j} className="h-1 flex-1 bg-white/30"><div className="h-full bg-white" style=${{width:(j<i?100:j===i?Math.min(p,100):0)+'%'}}></div></div>`)}</div>
    <div className="flex items-center justify-between mt-3 body text-xs font-bold"><span>${k.name} · ${v.date}</span><div className="flex gap-2 pointer-events-auto">${v.clip && html`<button onClick=${()=>setMute(!mute)} className="border-2 border-white px-1.5 text-[10px] font-black">${mute?'SIN SONIDO':'SONIDO ON'}</button>`}<button onClick=${onClose} className="border-2 border-white p-0.5"><${Ic} d=${I.x} size=${16}/></button></div></div>
   </div>
   <div className="relative z-10 px-4 pointer-events-none">
    ${k.nick && html`<div className="marker text-[#f1c40f] text-xl mb-2">"${k.nick}"</div>`}
    <div className="anton text-5xl st-big uppercase leading-none" style=${{textShadow:'4px 4px 0 #000'}}>${v.short}</div>
    <div className="body text-sm mt-3 font-bold st-sub">${v.title}</div>
    <div className="body text-xs text-gray-300 mt-1 st-sub">${v.spot}${v.dur?' · '+v.dur:''}</div>

   </div>
  </div>
  <button onClick=${e=>{e.stopPropagation();next()}} aria-label="Siguiente" className="hidden md:flex shrink-0 ml-4 w-12 h-12 items-center justify-center bg-[#f1c40f] text-black border-4 border-black hard"><${Ic} d=${'<path d="M9 18l6-6-6-6"/>'} size=${28}/></button>
 </div>`;

 const set = k => e => setF({...f,[k]:e.target.value});
 const send = () => {
  const text = `🛹 Clip para CREW ARCHIVES\nNombre/crew: ${f.name}\nLink: ${f.link}\nTruco y spot: ${f.trick||'-'}`;
  const enc = encodeURIComponent(text);
  let url = null;
  if(CONTACT.whatsapp) url = `https://wa.me/${CONTACT.whatsapp}?text=${enc}`;
  else if(CONTACT.email) url = `mailto:${CONTACT.email}?subject=${encodeURIComponent('Clip para CREW ARCHIVES')}&body=${enc}`;
  else if(CONTACT.instagram) url = `https://ig.me/m/${CONTACT.instagram}`;
  if(!CONTACT.whatsapp&&!CONTACT.email){ try{navigator.clipboard.writeText(text)}catch(e){} }
  if(url) window.open(url,'_blank','noopener');
  setSent(url?'ok':'copiado');
 };
 const inp = 'w-full bg-black border-2 border-[#555] px-2 py-1.5 text-base md:text-sm text-white focus:outline-none focus:border-[#f1c40f]';
 return html`<aside className="space-y-6 body min-w-0">
  <div className="border-4 border-black bg-[#e63946] hard p-3 text-black">
   <div className="anton text-xl uppercase">COVER OF THE MONTH</div>
   <div className="aspect-[3/4] mt-2 border-4 border-black relative overflow-hidden" style=${{background:`url(${COVER.img}) center/cover,#111`}}>
    <div className="absolute inset-x-0 top-0 p-3 bg-gradient-to-b from-black/70 to-transparent"><div className="anton text-2xl text-white leading-none" style=${{textShadow:'2px 2px 0 #000'}}>CREW ARCHIVES</div></div>
    <div className="absolute inset-x-0 bottom-0 p-3 pt-10 bg-gradient-to-t from-black/85 to-transparent"><div className="anton text-white text-3xl uppercase leading-none" style=${{textShadow:'3px 3px 0 #000'}}>${COVER.name}<br/>${COVER.title}</div></div>
   </div>
  </div>
  <div className="border-4 border-white bg-[#1a1a1a] p-3">
   <div className="anton text-xl uppercase text-[#f1c40f] mb-2">★ HALL OF FAME</div>
   <ol className="space-y-2">
    ${HOF.map((h,i)=>{const gi=STORY_GROUPS.findIndex(gr=>gr[0].sk===h.sk);const it=STORY_GROUPS[gi]&&STORY_GROUPS[gi][h.n-1];if(!it)return null;return html`<li key=${i} className="border-b border-[#333] pb-2"><button onClick=${()=>onOpen({g:gi,i:h.n-1})} className="flex gap-2 items-start w-full text-left"><span className="anton text-2xl text-[#e63946] w-6">${i+1}</span><span className="text-sm font-bold">${skOf(h.sk).name} — ${it.title} <span className="text-[#f1c40f]">▶</span></span></button></li>`})}
   </ol>
  </div>
  <div id="enviar" className="border-4 border-[#f1c40f] bg-[#1a1a1a] p-3">
   <div className="anton text-xl uppercase mb-2 flex items-center gap-2"><${Ic} d=${I.up}/> ENVÍA TU CLIP</div>
   ${sent ? html`<div className="text-center py-4"><div className="marker text-2xl text-[#f1c40f]">${sent==='ok'?'¡CASI LISTO!':'MENSAJE COPIADO'}</div><p className="text-sm text-gray-300 mt-1">${sent==='ok'?'Se abrió tu mensaje con el clip: solo falta darle enviar.':'Pégalo en un mensaje y mándalo al crew.'}</p><button onClick=${()=>{setSent('');setF({name:'',link:'',trick:''})}} className="mt-3 anton uppercase underline">Enviar otro</button></div>` :
   html`<div className="space-y-2">
    <input className=${inp} placeholder="Tu nombre / crew" value=${f.name} onChange=${set('name')}/>
    <input className=${inp} placeholder="Link del clip (YouTube, IG...)" value=${f.link} onChange=${set('link')}/>
    <textarea className=${inp} rows="2" placeholder="Truco y spot" value=${f.trick} onChange=${set('trick')}></textarea>
    <button disabled=${!f.name||!f.link} onClick=${send} className="w-full anton uppercase tracking-widest bg-[#e63946] text-white py-2 border-4 border-black hard disabled:opacity-40">MANDAR AL ARCHIVO</button>
   </div>`}
  </div>
  <div className="border-4 border-black bg-white text-black p-3 text-center hard tape">
   <div className="anton text-2xl uppercase">MERCH DROP</div>
   <div className="text-sm font-bold">Polera "Skate and Destroy" — $18.990</div>
  </div>
 </aside>`;
};

/* ---------- MODAL ---------- */
const Profile = ({id,onClose,onFilter}) => {
 const s = skOf(id);
 const vids = VIDEOS.filter(v=>v.sk===id);
 useEffect(()=>{const o=document.body.style.overflow;document.body.style.overflow='hidden';return ()=>{document.body.style.overflow=o}},[]);
 return html`<div className="fixed inset-0 z-50 bg-black/80 flex justify-center ov overflow-y-auto" onClick=${onClose}>
  <div className="relative w-full max-w-2xl bg-[#161616] border-4 border-white hard-r body my-auto" onClick=${e=>e.stopPropagation()}>
   <button onClick=${onClose} className="absolute -top-3 -right-3 bg-[#e63946] text-white border-4 border-black p-1"><${Ic} d=${I.x}/></button>
   <div className="p-5 grain" style=${{background:`linear-gradient(120deg,hsl(${s.hue} 70% 25%),#111)`}}>
    ${s.nick && html`<div className="marker text-[#f1c40f] text-xl">"${s.nick}"</div>`}
    <div className="anton text-6xl uppercase leading-none" style=${{textShadow:'4px 4px 0 #000'}}>${s.name}</div>
    <div className="text-sm mt-1">${[s.stance,s.years&&s.years+' años rodando',s.spot].filter(Boolean).join(' · ')}</div>
    ${s.ig && html`<a href=${s.ig} target="_blank" rel="noopener noreferrer" className="inline-block mt-2 text-xs font-black bg-white text-black px-2 py-1 border-2 border-black">SU INSTAGRAM ↗</a>`}
   </div>
   ${(s.favs.length>0||Object.keys(s.setup).length>0) && html`<div className="p-5 grid md:grid-cols-2 gap-5">
    <div>
     <div className="anton uppercase text-[#f1c40f] text-lg mb-2">TRUCOS FAVORITOS</div>
     <ul className="space-y-1">${s.favs.map(f=>html`<li key=${f} className="border-l-4 border-[#e63946] pl-2 font-bold text-sm">${f}</li>`)}</ul>
    </div>
    <div>
     <div className="anton uppercase text-[#f1c40f] text-lg mb-2">SETUP</div>
     <dl className="text-sm space-y-1">${Object.entries(s.setup).map(([k,v])=>html`<div key=${k} className="flex justify-between border-b border-[#333]"><dt className="uppercase text-gray-400">${k}</dt><dd className="font-bold">${v}</dd></div>`)}</dl>
    </div>
   </div>`}
   <div className="px-5 pb-5">
    <div className="anton uppercase text-[#f1c40f] text-lg mb-2">EDITS (${vids.length})</div>
    ${vids.length===0 && html`<p className="text-sm text-gray-400 mb-4">Todavía no hay edits de ${s.name}. Mira sus highlights en las stories de arriba.</p>`}
    <ul className="space-y-1 mb-4">${vids.map(v=>html`<li key=${v.id} className="text-sm flex justify-between gap-2"><span>▶ ${v.title}</span><span className="text-gray-400">${v.dur}</span></li>`)}</ul>
    <button onClick=${()=>{onFilter(id);onClose()}} className="anton uppercase tracking-widest bg-[#f1c40f] text-black px-4 py-2 border-4 border-black hard">FILTRAR SOLO A ${s.name}</button>
   </div>
  </div>
 </div>`;
};

/* ---------- APP ---------- */
const App = () => {
 const [filter,setFilter] = useState('all');
 const [activeId,setActiveId] = useState(1);
 const [liked,setLiked] = useState({});
 const [profile,setProfile] = useState(null);
 const [story,setStory] = useState(null);
 const [auto,setAuto] = useState(0);
 const [shown,setShown] = useState(12);
 const list = useMemo(()=>filter==='all'?VIDEOS:VIDEOS.filter(v=>v.sk===filter),[filter]);
 const pickFilter = f => {setFilter(f);setShown(12)};
 const active = VIDEOS.find(v=>v.id===activeId);
 const likes = v => v.likes + (liked[v.id]?1:0);
 const toggle = id => setLiked(l=>({...l,[id]:!l[id]}));
 const nextVideo = () => {const idx=list.findIndex(x=>x.id===activeId);const n=list[idx+1];if(n){setActiveId(n.id);return true}return false};
 const pick = id => {setActiveId(id);setAuto(a=>a+1);window.scrollTo({top:0,behavior:'smooth'})};
 const nav = n => {
  const target = n.startsWith('CREW')?'crew':n==='VIDEOS'?'grid':n==='SPOTS'?'spots':null;
  if(target) document.getElementById(target)?.scrollIntoView({behavior:'smooth'});
  else window.scrollTo({top:0,behavior:'smooth'});
 };
 return html`<div className="min-h-screen">
  <${Header} onNav=${nav}/>
  <main className="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_320px] gap-8">
   <div className="min-w-0">
    <${Stories} onOpen=${setStory}/>
    <${Hero} key=${'h'+auto} autoplay=${auto>0} onNext=${nextVideo} v=${active} likes=${likes(active)} liked=${!!liked[active.id]} onLike=${()=>toggle(active.id)} onProfile=${setProfile}/>
    <${Roster} filter=${filter} setFilter=${pickFilter} onProfile=${setProfile}/>
    <section id="grid" className="mt-8">
     <h3 className="anton text-3xl uppercase mb-4 flex items-center gap-3"><span className="bg-[#f1c40f] text-black px-2">LATEST</span> EDITS / VIDEO PARTS <span className="text-sm text-gray-400 body">(${list.length})</span></h3>
     ${list.length===0 && html`<p className="body text-sm text-gray-400">Todavía no hay edits de este skater. Mira sus highlights en las stories de arriba.</p>`}
     <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-5">
      ${list.slice(0,shown).map(v=>html`<${Card} key=${v.id} v=${v} likes=${likes(v)} liked=${!!liked[v.id]} active=${v.id===activeId} onPick=${pick} onLike=${()=>toggle(v.id)}/>`)}
     </div>
     ${list.length>shown && html`<button onClick=${()=>setShown(n=>n+12)} className="mt-6 anton uppercase tracking-widest bg-[#f1c40f] text-black px-5 py-2 border-4 border-black hard">VER MÁS (${list.length-shown})</button>`}
    </section>
    <${Spots} onSend=${()=>document.getElementById('enviar')?.scrollIntoView({behavior:'smooth'})}/>
   </div>
   <${Sidebar} onOpen=${setStory}/>
  </main>
  <footer className="border-t-4 border-[#e63946] bg-black py-6 text-center body text-xs text-gray-400">
   <div className="flex justify-center mb-2"><${Skull} size=${36}/></div>
   CREW ARCHIVES © 2026 — SKATE AND DESTROY. Prototipo inspirado en la estética de las revistas de skate.
  </footer>
  ${story!==null && html`<${StoryViewer} start=${story.g} startI=${story.i} onClose=${()=>setStory(null)} onWatch=${id=>{setStory(null);pick(id)}}/>`}
  ${profile && html`<${Profile} id=${profile} onClose=${()=>setProfile(null)} onFilter=${pickFilter}/>`}
 </div>`;
};
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
